version: 2.1

jobs:
  monolog:
    docker:
      - image: cimg/php:8.5
    environment:
      COMPOSER_ROOT_VERSION: dev-main
      COMPOSER_CACHE_DIR: /home/circleci/.cache/composer
    steps:
      - checkout
      # composer.json disables lockfiles; cache downloads, not resolved dependencies.
      - restore_cache:
          keys:
            - composer-v1-php8.5-{{ checksum "composer.json" }}
      - run:
          name: Install dependencies
          # Match CI's PHP 8.5 compatibility option.
          # MongoDB is optional and its tests skip when the extension is absent.
          command: |
            # Match setup-php defaults used by the existing CI, including subprocesses.
            printf '%s\n' 'error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT' 'zend.exception_ignore_args = On' | sudo tee /etc/php.d/monolog-ci.ini
            composer install --no-interaction --prefer-dist --no-progress --ignore-platform-req=php+ --ignore-platform-req=ext-mongodb
      - save_cache:
          key: composer-v1-php8.5-{{ checksum "composer.json" }}
          paths:
            - /home/circleci/.cache/composer
      # This library has no build command.
      - run:
          name: Run tests
          # Same exclusions as the main GitHub Actions test job.
          command: composer exec phpunit -- --exclude-group Elasticsearch --exclude-group Elastica --exclude-group e2e
      - run:
          name: Lint PHP files
          # Reuse the repository's PHP Lint workflow command.
          # composer phpstan currently reports two existing unused parameter/variable
          # findings; add it once those are resolved to keep this starter passing.
          command: |
            hasErrors=0
            for f in $(find src/ tests/ -type f -name '*.php' ! -path '*/vendor/*' ! -path '*/Fixtures/*')
            do
              { error="$(php -derror_reporting=-1 -ddisplay_errors=1 -l -f $f 2>&1 1>&3 3>&-)"; } 3>&1;
              if [ "$error" != "" ]; then
                while IFS= read -r line; do echo "::error file=$f::$line"; done \<<< "$error"
                hasErrors=1
              fi
            done
            if [ $hasErrors -eq 1 ]; then
              exit 1
            fi

workflows:
  ci:
    jobs:
      - monolog
